[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickbite-order-processing"
version = "1.0.0"
description = "Scalable food delivery order processing system: FastAPI + RabbitMQ + async workers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aio-pika>=9.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quickbite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors; I: import sorting; UP: pyupgrade; B: bugbear; RUF100: stale noqa.
select = ["E", "F", "I", "UP", "B", "RUF100"]
ignore = [
    # FastAPI's Depends() in parameter defaults is the idiomatic pattern.
    "B008",
    # Blind `except Exception` is a deliberate reliability boundary in the
    # workers (a handler bug must never kill the worker) and in startup code.
    "BLE001",
]
